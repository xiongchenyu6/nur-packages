name: Dependency update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: dependency-update
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Free Linux runner space for dependency builds
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: xiongchenyu6
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Test update handling
        run: |
          nix shell --inputs-from . nixpkgs#python3 nixpkgs#bash nixpkgs#jq nixpkgs#ripgrep nixpkgs#perl nixpkgs#shellcheck \
            --command bash -c 'shellcheck scripts/update*.sh && python3 scripts/test-update-changed-packages.py'
      - name: Discover versions and refresh dependency hashes
        run: nix run .#update
      - name: Prepare the proposed update
        id: patch
        run: |
          set -Eeuo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --binary > "$RUNNER_TEMP/update.patch"
          git diff --cached --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: dependency-update-patch
          path: ${{ runner.temp }}/update.patch
          retention-days: 1

  verify:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      update-patch: true
      base-revision: ${{ github.sha }}
    secrets: inherit

  publish:
    needs: [update, verify]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: dependency-update-patch
          path: ${{ runner.temp }}/dependency-update
      - name: Publish the update after every architecture passes
        run: |
          set -Eeuo pipefail
          git apply --index "$RUNNER_TEMP/dependency-update/update.patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update flake inputs and nvfetcher sources"
          # A concurrent human push must fail, never overwrite or publish a
          # rebased configuration that the architecture gate did not check.
          git push origin HEAD:master
      - name: Notify dotfiles
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CASCADE_TOKEN is not configured; dotfiles will catch up on its schedule."
            exit 0
          fi
          gh api repos/xiongchenyu6/dotfiles/dispatches -f event_type=nur-packages-updated
      - name: Notify NUR
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -XPOST "https://nur-update.nix-community.org/update?repo=xiongchenyu6")
          case "$code" in 2??|429) ;; *) exit 1;; esac

  report:
    needs: [update, verify, publish]
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # This job merges its own work, so a failure is only visible if something
      # says so. GitHub's failure email is easy to filter into oblivion, and the
      # run was broken for four nights before anyone noticed. One issue is kept
      # open while it is failing and closed again on the next success, so a
      # month of failures does not become thirty issues.
      - name: Report failure
        if: contains(needs.*.result, 'failure')
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --label automation --state open \
            --search "in:title $TITLE" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $run_url"
          else
            gh issue create --title "$TITLE" --label automation --label dependencies \
              --body "The nightly dependency update failed.

          Run: $run_url

          It rebuilds every package whose source moved, so this usually means one
          of them stopped building against current nixpkgs rather than anything
          wrong with the workflow. This issue closes itself on the next green run."
          fi
        env:
          TITLE: "Dependency update is failing"

      - name: Close the failure issue
        if: >-
          needs.update.result == 'success' &&
          (needs.update.outputs.changed != 'true' ||
          (needs.verify.result == 'success' && needs.publish.result == 'success'))
        run: |
          gh issue list --label automation --state open \
            --search "in:title $TITLE" --json number --jq '.[].number' \
          | while read -r n; do
              gh issue close "$n" --comment "Green again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            done
        env:
          TITLE: "Dependency update is failing"
