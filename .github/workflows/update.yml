name: Daily dependency update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-dependency-update
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NIX_CONFIG: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: "true"
      NIXPKGS_ALLOW_UNFREE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Run daily update
        run: nix run .#update

      - name: Show working tree
        if: always()
        run: git status --short

      - name: Create pull request
        id: cpr
        if: success()
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/daily-dependency-update
          base: master
          delete-branch: true
          commit-message: "chore: update flake inputs and nvfetcher sources"
          title: "chore: daily dependency update"
          body: |
            Automated daily update run.

            This updates:
            - `flake.lock`
            - `_sources/generated.nix`
            - `_sources/generated.json`
            - fixed-output dependency hashes reported by package builds

            Merged automatically: the update step above rebuilds every package
            whose source changed, so reaching this point means they all built.
          labels: |
            dependencies
            automated

      # Merged from here rather than with `gh pr merge --auto`. Auto-merge waits
      # on required status checks, master has none, and a PR opened with
      # GITHUB_TOKEN cannot trigger build.yml anyway — GitHub suppresses
      # workflow runs for token-authored events to avoid recursion. The gate is
      # therefore the update step itself: scripts/update.sh ends by rebuilding
      # every package whose source moved, and a failure there fails this job
      # before it ever gets here.
      - name: Merge the update
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          gh pr merge "$PR" --squash --delete-branch
          echo "Merged #$PR ($(gh pr view "$PR" --json title --jq .title))"
        env:
          PR: ${{ steps.cpr.outputs.pull-request-number }}
