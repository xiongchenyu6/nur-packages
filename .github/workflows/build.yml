name: Build and populate cache

on:
  workflow_call:
    inputs:
      update-patch:
        type: boolean
        default: false
      base-revision:
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "51 2 * * *"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: x86_64-darwin
            runner: macos-15-intel
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free Linux runner space for native builds
        if: runner.os == 'Linux'
        run: |
          df -h /
          # These SDKs are not used by Nix or any package built here. Keep
          # system compilers, Git, Node and the Actions tool cache intact.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: inputs.update-patch
        with:
          name: dependency-update-patch
          path: ${{ runner.temp }}/dependency-update
      - name: Apply the exact proposed update
        if: inputs.update-patch
        run: git apply --index "$RUNNER_TEMP/dependency-update/update.patch"
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: xiongchenyu6
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build changed packages on the actual target architecture
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          UPDATE_BASE_REV: ${{ inputs.base-revision || github.event.pull_request.base.sha || github.event.before }}
          UPDATE_FIX_HASHES: "0"
        run: |
          set -Eeuo pipefail
          actual=$(nix eval --impure --raw --expr builtins.currentSystem)
          test "$actual" = "$EXPECTED_SYSTEM"
          # Scheduled/manual runs keep the existing librime/Sub2API cache warm.
          # Updates and PRs additionally build every changed package, not the
          # entire repository on every hourly update.
          export UPDATE_EXTRA_TARGETS=librime
          case "$actual" in *-linux) export UPDATE_EXTRA_TARGETS="librime sub2api";; esac
          if [ -z "$UPDATE_BASE_REV" ] || ! git cat-file -e "$UPDATE_BASE_REV^{commit}" 2>/dev/null; then
            export UPDATE_BASE_REV=HEAD
          fi
          nix shell --inputs-from . nixpkgs#bash nixpkgs#jq nixpkgs#ripgrep nixpkgs#perl \
            --command bash scripts/update-changed-packages.sh

  notify:
    needs: build
    if: github.event_name != 'pull_request' && !inputs.update-patch
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger NUR update after every architecture passes
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -XPOST "https://nur-update.nix-community.org/update?repo=xiongchenyu6")
          echo "NUR update endpoint returned $code"
          case "$code" in 2??|429) ;; *) exit 1;; esac
